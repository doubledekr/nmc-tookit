name: Build desktop app

on:
  push:
    branches: [main]
    paths:
      - "nmc-toolkit-desktop/**"
      - "banker-toolkit/neighborhood-toolkit.html"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: NMC-Toolkit-mac
            glob: |
              nmc-toolkit-desktop/dist/*.dmg
              nmc-toolkit-desktop/dist/*.zip
              nmc-toolkit-desktop/dist/latest-mac.yml
          - os: windows-latest
            script: build:win
            artifact: NMC-Toolkit-windows
            glob: |
              nmc-toolkit-desktop/dist/*.exe
              nmc-toolkit-desktop/dist/latest.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nmc-toolkit-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nmc-toolkit-desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned until certificates are added (see README-DESKTOP.md)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'    # branch builds only produce downloadable artifacts, never a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - id: v
        run: echo "version=$(node -p "require('./nmc-toolkit-desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: NMC Toolkit ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Desktop installers built by GitHub Actions from commit ${{ github.sha }} (build ${{ github.run_number }}).
            Installed copies check this page for updates automatically.

            - **Windows:** `NMC-Toolkit-Setup-*.exe` — unsigned, so SmartScreen may show "unrecognized app" → More info → Run anyway.
            - **Mac:** `NMC-Toolkit-*.dmg` — unsigned, so the first open is right-click → Open.

            Your data is stored with the app (Settings → Open data folder) and survives updates.
          files: out/**/*
