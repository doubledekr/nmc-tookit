name: Build desktop app

on:
  push:
    tags: ["v*"]          # tag a commit v1.0.0 → builds + publishes a Release with both installers
  workflow_dispatch:      # or run it by hand from the Actions tab
    inputs:
      version:
        description: "Release tag to create (e.g. v1.0.0). Leave blank to only attach installers to the run."
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nmc-toolkit-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned until certificates are added (see README-DESKTOP.md)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: NMC-Toolkit-${{ matrix.target }}
          path: |
            nmc-toolkit-desktop/dist/*.dmg
            nmc-toolkit-desktop/dist/*.exe
            nmc-toolkit-desktop/dist/*.zip
            nmc-toolkit-desktop/dist/*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: NMC Toolkit ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.yml
          body: |
            Desktop installers for the NMC Toolkit.

            - **Windows:** download `NMC-Toolkit-Setup-*.exe`. SmartScreen will show "unrecognized app" until the build is code-signed — click *More info → Run anyway*.
            - **Mac:** download `NMC-Toolkit-*.dmg`, drag to Applications. Unsigned for now: the first time, right-click the app → *Open*.

            The `latest*.yml` files are for the hub's auto-update feed.
