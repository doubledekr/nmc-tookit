name: Build desktop app

on:
  push:
    branches: [main]
    paths:
      - "nmc-toolkit-desktop/**"
      - "banker-toolkit/neighborhood-toolkit.html"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows is what the team runs, so it builds and publishes on its own. The Mac build runs beside it and attaches its
  # installer to the same release whenever GitHub's macOS runners get to it (they can sit in the queue for a long time).
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nmc-toolkit-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nmc-toolkit-desktop/package-lock.json
      - run: npm ci
      - run: npm run build:win || (sleep 30 && npm run build:win)   # the NSIS/tool downloads from GitHub occasionally 5xx; one retry
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned until certificates are added (see README-DESKTOP.md)
      - uses: actions/upload-artifact@v4
        with:
          name: NMC-Toolkit-windows
          path: |
            nmc-toolkit-desktop/dist/*.exe
            nmc-toolkit-desktop/dist/latest.yml
          if-no-files-found: error

  release:
    needs: build-win
    if: github.ref == 'refs/heads/main'    # branch builds only produce downloadable artifacts, never a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NMC-Toolkit-windows
          path: out
      - id: v
        run: echo "version=$(node -p "require('./nmc-toolkit-desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: NMC Toolkit ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Desktop installers built by GitHub Actions from commit ${{ github.sha }} (build ${{ github.run_number }}).
            Installed copies check this page for updates automatically.

            - **Windows:** `NMC-Toolkit-Setup-*.exe` — unsigned, so SmartScreen may show "unrecognized app" → More info → Run anyway.
            - **Mac:** `NMC-Toolkit-*.dmg` — attached when the Mac build finishes (GitHub's Mac runners can lag). Unsigned, so the first open is right-click → Open.

            Your data is stored with the app (Settings → Open data folder) and survives updates.
          files: out/**/*

  # Runs only after the Windows release exists: the Mac job must never be the one that creates the release, or a Windows app
  # that checks for updates finds a "latest" release with no Windows files and falls back to the manual download link.
  build-mac:
    needs: release
    if: always() && (needs.release.result == 'success' || github.ref != 'refs/heads/main')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nmc-toolkit-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nmc-toolkit-desktop/package-lock.json
      - run: npm ci
      - run: npm run build:mac || (sleep 30 && npm run build:mac)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: NMC-Toolkit-mac
          path: |
            nmc-toolkit-desktop/dist/*.dmg
            nmc-toolkit-desktop/dist/*.zip
            nmc-toolkit-desktop/dist/latest-mac.yml
          if-no-files-found: error
      - id: v
        if: github.ref == 'refs/heads/main'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attach the Mac installer to the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: NMC Toolkit ${{ steps.v.outputs.version }}
          files: |
            nmc-toolkit-desktop/dist/*.dmg
            nmc-toolkit-desktop/dist/*.zip
            nmc-toolkit-desktop/dist/latest-mac.yml
