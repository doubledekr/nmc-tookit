<!doctype html><html><head><meta charset="utf-8"><title>NMC Toolkit</title>
<style>body{font:13.5px system-ui,sans-serif;width:300px;margin:0;padding:14px;color:#23242B;background:#FBF8F2}
h1{font-size:15px;margin:0 0 6px;color:#A53222}.hint{color:#5C616E;font-size:12px;margin:6px 0}
button{background:#A53222;color:#fff;border:0;border-radius:8px;padding:9px 12px;font:600 13px system-ui;cursor:pointer;width:100%;margin-top:8px}
button.ghost{background:#fff;color:#23242B;border:1px solid #D9D3C6}.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px}
.ok{background:#E3F1E7;color:#2E6B4F}.bad{background:#FBE9E5;color:#8F3223}label{display:block;margin-top:10px;font-size:12px;color:#5C616E}
input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #D9D3C6;border-radius:6px;font:13px system-ui}</style></head>
<body><h1>NMC Toolkit</h1>
<div id="status" class="hint">Checking for the toolkit app…</div>
<button id="send">Send this lead to the toolkit</button>
<div class="hint" id="result"></div>
<button class="ghost" id="copy">Copy harvested text (to compare with the bookmarklet)</button>
<div class="hint" id="last"></div>
<label>Toolkit app port (default 47831)</label><input id="port" type="number" placeholder="47831">
<button class="ghost" id="save">Save port</button>
<script src="popup.js"></script></body></html>
